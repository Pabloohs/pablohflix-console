name: PabloHFlix one-time format

on:
  push:
    branches:
      - test/pablohflix-ci-validation
    paths:
      - .github/workflows/pablo-console-autoformat.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Pabloohs/pablohflix-console'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Format the two console components
        run: |
          bun x oxfmt apps/nextjs/src/components/pablo-console/frame.tsx apps/nextjs/src/components/pablo-console/frame.module.css
          git diff --check
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/nextjs/src/components/pablo-console/frame.tsx apps/nextjs/src/components/pablo-console/frame.module.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(console): apply upstream oxfmt formatting'
          git push origin HEAD:test/pablohflix-ci-validation
