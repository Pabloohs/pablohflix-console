name: PabloHFlix native Docker image
on:
  push:
    branches: [dev]
    paths:
      - Dockerfile
      - server.mjs
      - integrations.mjs
      - dashboard.mjs
      - preferences.mjs
      - recordstudio.mjs
      - recordstudio.mjs
      - public/**
      - scripts/**
      - .github/workflows/native-image.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Pabloohs/pablohflix-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Exercise the actual runtime image before publishing it to the NAS.
      # Unit tests run from the checkout and cannot detect missing COPY sources.
      - name: Smoke test Docker image boot and health endpoint
        run: |
          set -euo pipefail
          docker build --tag pablohflix-smoke:ci .
          docker run --detach --name pablohflix-smoke \
            -e DASHBOARD_USER=admin \
            -e DASHBOARD_PASSWORD=test-password-is-long-enough \
            -e DASHBOARD_SESSION_SECRET=test-secret-012345678901234567890123456789 \
            -p 127.0.0.1:13000:3000 pablohflix-smoke:ci
          trap 'docker logs pablohflix-smoke; docker rm --force pablohflix-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:13000/healthz; then
              echo "PabloHFlix image boots and /healthz responds"
              exit 0
            fi
            sleep 1
          done
          echo "PabloHFlix image failed startup or /healthz" >&2
          exit 1
      # The runtime previously crashed despite successful unit tests: a required
      # .mjs file was not copied by Dockerfile. Validate the complete image first.
      - name: Smoke test built container before publishing
        run: |
          docker build -t pablohflix:smoke .
          docker run -d --name pablohflix-smoke \
            -e DASHBOARD_USER=admin \
            -e DASHBOARD_PASSWORD=smoke-password-strong-123 \
            -e DASHBOARD_SESSION_SECRET=smoke-session-secret-012345678901234567890 \
            pablohflix:smoke
          docker exec pablohflix-smoke node -e '
            (async()=>{
              for(let attempt=0;attempt<12;attempt++){
                try {
                  const response=await fetch("http://127.0.0.1:3000/healthz",{signal:AbortSignal.timeout(1000)});
                  if(response.ok){console.log("PabloHFlix runtime OK");return;}
                }catch{}
                await new Promise(resolve=>setTimeout(resolve,500));
              }
              throw Error("PabloHFlix healthz did not start");
            })().catch(e=>{console.error(e);process.exit(1)});
          '
          docker rm -f pablohflix-smoke
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pabloohs/pablohflix-console:native-preview
            ghcr.io/pabloohs/pablohflix-console:native-${{ github.sha }}
