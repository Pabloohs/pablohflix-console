name: PabloHFlix native Docker image
on:
  push:
    branches: [dev]
    paths:
      - Dockerfile
      - server.mjs
      - integrations.mjs
      - public/**
      - scripts/**
      - .github/workflows/native-image.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Pabloohs/pablohflix-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pabloohs/pablohflix-console:native-preview
            ghcr.io/pabloohs/pablohflix-console:native-${{ github.sha }}
