name: PabloHFlix native tests
on:
  push:
    branches: [dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.mjs
      - run: node --check integrations.mjs
      - run: node --check dashboard.mjs
      - run: node --check preferences.mjs
      - run: node --check public/experience.js
      - run: node --check public/preferences-settings.js
      - run: node --check public/settings.js
      - run: node --check public/dashboard-cards.js
      - run: node --check public/integrations.js
      - run: node --check public/widgets.js
      - run: node --test tests/*.test.mjs
