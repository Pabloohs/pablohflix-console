# EXEMPLE PUBLIC NON DÉPLOYABLE TEL QUEL : remplacer localement les IP, chemins, UID/GID et réseaux.
# Ne jamais remplacer le Compose de production sans vérifier ses montages et ses secrets.
# Déployer uniquement après avoir créé le dossier et les secrets indiqués dans README.
name: pablohflix-native-preview
services:
  console:
    image: ghcr.io/pabloohs/pablohflix-console:native-preview
    container_name: pablohflix-native-preview
    user: "1000:1000" # EXEMPLE : définir votre UID/GID réel localement
    restart: unless-stopped
    env_file:
      - /volume1/docker/console-example/.env
    environment:
      TZ: Europe/Paris
      PORT: "3000"
      DATA_DIR: /app/data
      METRICS_DIR: /app/metrics
      HOST_VOLUME1_PATH: /app/data
      HOST_VOLUME2_PATH: /app/volume2-probe
    # Accès local uniquement par défaut ; adapter sur le NAS pour LAN/Tailscale.
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - /volume1/docker/console-example/data:/app/data
      - /volume1/docker/monitoring-example/metrics:/app/metrics:ro
      # Mount an empty dedicated folder; never mount personal/media contents for disk statistics.
      - /volume2/empty-monitoring-probe:/app/volume2-probe:ro
    networks:
      - private_console
      - media_services
      - jellyfin_default
      - recordstudio_default  # API VPN du projet recordstudio
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
networks:
  private_console: {}
  media_services:
    external: true
  jellyfin_default:
    external: true
  recordstudio_default:
    external: true
